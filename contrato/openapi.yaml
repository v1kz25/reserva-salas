openapi: 3.1.0
info:
  title: Reserva de salas API
  version: 0.1.0
  description: |
    API para gestionar salas de reuniones y sus reservas.

    Reglas de negocio de las reservas:
    - No puede haber reservas solapadas en la misma sala (`409`).
    - `horaFin` debe ser posterior a `horaInicio` (`400`).
    - Solo se reserva a partir de mañana: `fecha` debe ser posterior a hoy (`400`).

    Autenticación y permisos:
    - Sesión HTTP en cookie (`JSESSIONID`, `HttpOnly`, `SameSite=Strict`). Se obtiene con
      `POST /api/auth/login` y se cierra con `POST /api/auth/logout`.
    - Todas las rutas `/api/**` exigen sesión, salvo `GET /api/auth/csrf` y `POST /api/auth/login`.
      Sin sesión (o con la sesión caducada) responden `401`.
    - Roles `USER` y `ADMIN`. Un `USER` solo cancela sus propias reservas; un `ADMIN`, cualquiera.
      Crear, modificar y eliminar salas es solo para `ADMIN`. Sin permiso se responde `403`.
    - El responsable de una reserva es siempre el usuario que la crea.

    Protección CSRF:
    - El servidor envía el token en la cookie `XSRF-TOKEN` (legible desde JavaScript).
    - Toda petición `POST`, `PUT` o `DELETE` (incluido el login) debe repetirlo en la cabecera
      `X-XSRF-TOKEN`; si falta o no coincide se responde `403`.
    - Antes del login, `GET /api/auth/csrf` emite la cookie. Tras el login y el logout el token
      cambia: el cliente debe usar siempre el valor actual de la cookie.

    Todos los errores usan el formato `ProblemDetail` (RFC 9457).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Desarrollo local
security:
  - sesion: []
tags:
  - name: Autenticación
    description: Inicio y cierre de sesión y usuario actual
  - name: Salas
    description: Salas de reuniones disponibles
  - name: Reservas
    description: Reservas de una sala en una franja horaria

paths:
  /api/auth/csrf:
    get:
      tags: [Autenticación]
      operationId: obtenerCsrf
      summary: Emite la cookie del token CSRF
      description: No requiere sesión. Responde con la cookie `XSRF-TOKEN` y sin cuerpo.
      security: []
      responses:
        '204':
          description: Cookie `XSRF-TOKEN` emitida
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<token>; Path=/; SameSite=Strict`'
              schema:
                type: string

  /api/auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Inicia sesión
      description: |
        No requiere sesión, pero sí la cabecera `X-XSRF-TOKEN`. Si ya había una sesión, se
        sustituye por una nueva.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: '`JSESSIONID=<id>; Path=/; HttpOnly; SameSite=Strict` y un nuevo `XSRF-TOKEN`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          description: |
            Credenciales no válidas. El mensaje es el mismo si el email no existe o si la
            contraseña es incorrecta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /api/auth/logout:
    post:
      tags: [Autenticación]
      operationId: cerrarSesion
      summary: Cierra la sesión
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /api/auth/me:
    get:
      tags: [Autenticación]
      operationId: obtenerUsuarioActual
      summary: Obtiene el usuario de la sesión
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/salas:
    get:
      tags: [Salas]
      operationId: listarSalas
      summary: Lista todas las salas
      responses:
        '200':
          description: Salas ordenadas por nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sala'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Salas]
      operationId: crearSala
      summary: Crea una sala
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaRequest'
      responses:
        '201':
          description: Sala creada
          headers:
            Location:
              description: URL de la sala creada
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ya existe una sala con ese nombre
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/salas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Salas]
      operationId: obtenerSala
      summary: Obtiene una sala
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Salas]
      operationId: modificarSala
      summary: Modifica una sala
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaRequest'
      responses:
        '200':
          description: Sala modificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya existe otra sala con ese nombre
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Salas]
      operationId: eliminarSala
      summary: Elimina una sala
      responses:
        '204':
          description: Sala eliminada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La sala tiene reservas futuras y no se puede eliminar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/reservas:
    get:
      tags: [Reservas]
      operationId: listarReservas
      summary: Lista reservas, con filtros opcionales
      parameters:
        - name: salaId
          in: query
          required: false
          description: Solo las reservas de esta sala
          schema:
            type: integer
            format: int64
        - name: fechaDesde
          in: query
          required: false
          description: Solo las reservas de este día o posteriores (inclusive)
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          required: false
          description: |
            Solo las reservas de este día o anteriores (inclusive).
            Si se indican ambas, `fechaHasta` no puede ser anterior a `fechaDesde` (`400`).
            Para un solo día, se envía la misma fecha en las dos.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Reservas ordenadas por fecha y hora de inicio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Reservas]
      operationId: crearReserva
      summary: Crea una reserva
      description: El responsable es el usuario de la sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '201':
          description: Reserva creada
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Falta el token CSRF o no es válido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: La sala indicada no existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          $ref: '#/components/responses/Solapamiento'

  /api/reservas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reservas]
      operationId: obtenerReserva
      summary: Obtiene una reserva
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    delete:
      tags: [Reservas]
      operationId: cancelarReserva
      summary: Cancela una reserva
      description: |
        La reserva se elimina y la franja queda libre. Un `USER` solo puede cancelar sus propias
        reservas; un `ADMIN`, cualquiera.
      responses:
        '204':
          description: Reserva cancelada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: La reserva es de otro usuario y el usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Cookie de sesión `HttpOnly` que se obtiene con `POST /api/auth/login`

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Sala:
      type: object
      required: [id, nombre, capacidad, planta]
      properties:
        id:
          type: integer
          format: int64
          examples: [1]
        nombre:
          type: string
          examples: [Sala Atlántico]
        capacidad:
          type: integer
          examples: [8]
        planta:
          type: integer
          examples: [2]

    SalaRequest:
      type: object
      required: [nombre, capacidad, planta]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        capacidad:
          type: integer
          minimum: 1
        planta:
          type: integer
          description: Puede ser negativa (sótanos)

    Reserva:
      type: object
      required: [id, salaId, fecha, horaInicio, horaFin, usuarioId, responsable, motivo]
      properties:
        id:
          type: integer
          format: int64
          examples: [1]
        salaId:
          type: integer
          format: int64
          examples: [1]
        fecha:
          type: string
          format: date
          examples: ['2026-10-15']
        horaInicio:
          $ref: '#/components/schemas/Hora'
        horaFin:
          $ref: '#/components/schemas/Hora'
        usuarioId:
          type: integer
          format: int64
          description: Usuario que hizo la reserva
          examples: [7]
        responsable:
          type: string
          readOnly: true
          description: Nombre del usuario que hizo la reserva
          examples: [Ana García]
        motivo:
          type: string
          examples: [Reunión de planificación]

    ReservaRequest:
      type: object
      required: [salaId, fecha, horaInicio, horaFin, motivo]
      properties:
        salaId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
          description: Debe ser posterior a hoy (se reserva a partir de mañana)
        horaInicio:
          $ref: '#/components/schemas/Hora'
        horaFin:
          $ref: '#/components/schemas/Hora'
        motivo:
          type: string
          minLength: 1
          maxLength: 255

    Usuario:
      type: object
      required: [id, email, nombre, rol]
      properties:
        id:
          type: integer
          format: int64
          examples: [7]
        email:
          type: string
          format: email
          examples: [ana@example.com]
        nombre:
          type: string
          examples: [Ana García]
        rol:
          $ref: '#/components/schemas/Rol'

    Rol:
      type: string
      enum: [USER, ADMIN]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    Hora:
      type: string
      description: Hora local en formato `HH:mm`
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      examples: ['09:30']

    ProblemDetail:
      type: object
      description: Error según RFC 9457
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          examples: [Reserva solapada]
        status:
          type: integer
          examples: [409]
        detail:
          type: string
          examples: [La sala 1 ya está reservada el 2026-10-15 de 09:00 a 10:00]
        instance:
          type: string
          format: uri-reference
          examples: [/api/reservas]
        errores:
          type: array
          description: Solo en errores de validación (`400`)
          items:
            $ref: '#/components/schemas/ErrorCampo'

    ErrorCampo:
      type: object
      required: [campo, mensaje]
      properties:
        campo:
          type: string
          examples: [horaFin]
        mensaje:
          type: string
          examples: [debe ser posterior a horaInicio]

  responses:
    ErrorValidacion:
      description: Datos no válidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoAutenticado:
      description: No hay sesión o ha caducado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    SinPermiso:
      description: Sin permiso para la operación, o falta el token CSRF
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Solapamiento:
      description: La reserva se solapa con otra de la misma sala
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
