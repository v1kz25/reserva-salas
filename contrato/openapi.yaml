openapi: 3.1.0
info:
  title: Reserva de salas API
  version: 0.1.0
  description: |
    API para gestionar salas de reuniones y sus reservas.

    Reglas de negocio de las reservas:
    - No puede haber reservas solapadas en la misma sala (`409`).
    - `horaFin` debe ser posterior a `horaInicio` (`400`).
    - Solo se reserva a partir de mañana: `fecha` debe ser posterior a hoy (`400`).

    Autenticación y permisos:
    - Sesión HTTP en cookie (`JSESSIONID`, `HttpOnly`, `SameSite=Strict`). Se obtiene con
      `POST /api/auth/login` y se cierra con `POST /api/auth/logout`.
    - Todas las rutas `/api/**` exigen sesión, salvo `GET /api/auth/csrf` y `POST /api/auth/login`.
      Sin sesión (o con la sesión caducada) responden `401`.
    - Roles `USER` y `ADMIN`. Un `USER` solo cancela sus propias reservas; un `ADMIN`, cualquiera.
      Crear, modificar y eliminar salas es solo para `ADMIN`. Sin permiso se responde `403`.
    - El responsable (organizador) de una reserva es siempre el usuario que la crea.
    - Un usuario desactivado no puede iniciar sesión. Al desactivar a un usuario o cambiar su
      rol se cierran sus sesiones abiertas.

    Privacidad de las reservas:
    - El organizador, sus invitados (pendientes o aceptados) y los `ADMIN` ven la reserva completa
      (`detalle: COMPLETO`).
    - El resto ve solo sala, fecha y franja (`detalle: OCUPADA`), sin organizador, motivo ni
      invitaciones.

    Zona horaria: «hoy» y «mañana» se calculan con la zona horaria configurada
    (`GET /api/config/zona-horaria`).

    Protección CSRF:
    - El servidor envía el token en la cookie `XSRF-TOKEN` (legible desde JavaScript).
    - Toda petición `POST`, `PUT` o `DELETE` (incluido el login) debe repetirlo en la cabecera
      `X-XSRF-TOKEN`; si falta o no coincide se responde `403`.
    - Antes del login, `GET /api/auth/csrf` emite la cookie. Tras el login y el logout el token
      cambia: el cliente debe usar siempre el valor actual de la cookie.

    Todos los errores usan el formato `ProblemDetail` (RFC 9457).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Desarrollo local
security:
  - sesion: []
tags:
  - name: Autenticación
    description: Inicio y cierre de sesión y usuario actual
  - name: Salas
    description: Salas de reuniones disponibles
  - name: Reservas
    description: Reservas de una sala en una franja horaria
  - name: Usuarios
    description: Gestión de usuarios (solo `ADMIN`) y buscador de usuarios
  - name: Amistades
    description: Solicitudes de amistad y amigos
  - name: Invitaciones
    description: Invitaciones de amigos a una reserva
  - name: Configuración
    description: Configuración de la aplicación

paths:
  /api/auth/csrf:
    get:
      tags: [Autenticación]
      operationId: obtenerCsrf
      summary: Emite la cookie del token CSRF
      description: No requiere sesión. Responde con la cookie `XSRF-TOKEN` y sin cuerpo.
      security: []
      responses:
        '204':
          description: Cookie `XSRF-TOKEN` emitida
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<token>; Path=/; SameSite=Strict`'
              schema:
                type: string

  /api/auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Inicia sesión
      description: |
        No requiere sesión, pero sí la cabecera `X-XSRF-TOKEN`. Si ya había una sesión, se
        sustituye por una nueva.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: '`JSESSIONID=<id>; Path=/; HttpOnly; SameSite=Strict` y un nuevo `XSRF-TOKEN`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          description: |
            Credenciales no válidas. El mensaje es el mismo si el email no existe o si la
            contraseña es incorrecta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /api/auth/logout:
    post:
      tags: [Autenticación]
      operationId: cerrarSesion
      summary: Cierra la sesión
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /api/auth/me:
    get:
      tags: [Autenticación]
      operationId: obtenerUsuarioActual
      summary: Obtiene el usuario de la sesión
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/salas:
    get:
      tags: [Salas]
      operationId: listarSalas
      summary: Lista todas las salas
      responses:
        '200':
          description: Salas ordenadas por nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sala'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Salas]
      operationId: crearSala
      summary: Crea una sala
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaRequest'
      responses:
        '201':
          description: Sala creada
          headers:
            Location:
              description: URL de la sala creada
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ya existe una sala con ese nombre
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/salas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Salas]
      operationId: obtenerSala
      summary: Obtiene una sala
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Salas]
      operationId: modificarSala
      summary: Modifica una sala
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaRequest'
      responses:
        '200':
          description: Sala modificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya existe otra sala con ese nombre
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Salas]
      operationId: eliminarSala
      summary: Elimina una sala
      description: |
        Solo si no tiene reservas de hoy en adelante (`409`). Sus reservas pasadas (y sus
        invitaciones) se eliminan con ella.
      responses:
        '204':
          description: Sala eliminada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La sala tiene reservas futuras y no se puede eliminar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/reservas:
    get:
      tags: [Reservas]
      operationId: listarReservas
      summary: Lista reservas, paginadas y con filtros opcionales
      description: |
        Las reservas en las que el usuario no participa salen con `detalle: OCUPADA`.
        Con `mis=true` solo salen las que organiza y aquellas a las que está invitado
        (pendiente o aceptada), siempre con `detalle: COMPLETO`.
      parameters:
        - name: mis
          in: query
          required: false
          description: Solo «Mis reservas» (organizadas e invitaciones pendientes o aceptadas)
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: Número de página, empezando en 0
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página (máximo 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: salaId
          in: query
          required: false
          description: Solo las reservas de esta sala
          schema:
            type: integer
            format: int64
        - name: fechaDesde
          in: query
          required: false
          description: Solo las reservas de este día o posteriores (inclusive)
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          required: false
          description: |
            Solo las reservas de este día o anteriores (inclusive).
            Si se indican ambas, `fechaHasta` no puede ser anterior a `fechaDesde` (`400`).
            Para un solo día, se envía la misma fecha en las dos.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Página de reservas ordenadas por fecha y hora de inicio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservas'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Reservas]
      operationId: crearReserva
      summary: Crea una reserva
      description: El responsable es el usuario de la sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '201':
          description: Reserva creada
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Falta el token CSRF o no es válido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: La sala indicada no existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          $ref: '#/components/responses/Solapamiento'

  /api/reservas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reservas]
      operationId: obtenerReserva
      summary: Obtiene una reserva
      description: |
        Con `detalle: COMPLETO` incluye las invitaciones. Si el usuario no participa, solo se
        devuelven sala, fecha y franja (`detalle: OCUPADA`).
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    delete:
      tags: [Reservas]
      operationId: cancelarReserva
      summary: Cancela una reserva
      description: |
        La reserva se elimina, la franja queda libre y se eliminan sus invitaciones. Un `USER`
        solo puede cancelar sus propias reservas; un `ADMIN`, cualquiera.
      responses:
        '204':
          description: Reserva cancelada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: La reserva es de otro usuario y el usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/reservas/{id}/invitaciones:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Invitaciones]
      operationId: invitarAReserva
      summary: Invita a un amigo a la reserva
      description: |
        Solo el organizador. El invitado debe ser amigo confirmado y estar activo. Aforo:
        organizador + invitaciones pendientes + aceptadas no pueden superar la capacidad de la sala.
        No se invita a reservas pasadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitacionRequest'
      responses:
        '201':
          description: Invitación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitacion'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: No eres el organizador de la reserva, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: No es tu amigo, ya está invitado, se supera el aforo o la reserva ya ha pasado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/reservas/{id}/invitaciones/{invitacionId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: invitacionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Invitaciones]
      operationId: retirarInvitacion
      summary: Retira una invitación
      description: Solo el organizador.
      responses:
        '204':
          description: Invitación retirada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: No eres el organizador de la reserva, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/invitaciones/pendientes:
    get:
      tags: [Invitaciones]
      operationId: listarInvitacionesPendientes
      summary: Lista mis invitaciones sin responder
      description: Solo de reservas que aún no han pasado, ordenadas por fecha de la reserva.
      responses:
        '200':
          description: Invitaciones pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitacionRecibida'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/invitaciones/{id}/aceptar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Invitaciones]
      operationId: aceptarInvitacion
      summary: Acepta una invitación
      description: Solo el invitado. Se puede aceptar una invitación pendiente.
      responses:
        '204':
          description: Invitación aceptada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: No existe o no es tuya
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: La invitación ya no está pendiente o la reserva ya ha pasado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/invitaciones/{id}/rechazar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Invitaciones]
      operationId: rechazarInvitacion
      summary: Rechaza una invitación
      description: |
        Solo el invitado. Vale para una invitación pendiente o ya aceptada (dejar de asistir),
        mientras la reserva no haya pasado.
      responses:
        '204':
          description: Invitación rechazada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: No existe o no es tuya
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: La invitación ya estaba rechazada o la reserva ya ha pasado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Lista los usuarios (solo `ADMIN`)
      responses:
        '200':
          description: Usuarios ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioAdmin'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Usuarios]
      operationId: crearUsuario
      summary: Crea un usuario (solo `ADMIN`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioNuevoRequest'
      responses:
        '201':
          description: Usuario creado
          headers:
            Location:
              description: URL del usuario creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ya existe un usuario con ese email
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/usuarios/buscar:
    get:
      tags: [Usuarios, Amistades]
      operationId: buscarUsuarios
      summary: Busca usuarios por nombre
      description: |
        Para cualquier usuario autenticado. Busca por nombre sin distinguir mayúsculas ni
        acentos. Excluye al propio usuario y a los desactivados. Como máximo 20 resultados.
      parameters:
        - name: q
          in: query
          required: true
          description: Texto a buscar (de 2 a 100 caracteres)
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Usuarios encontrados, ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResumen'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuarios]
      operationId: obtenerUsuario
      summary: Obtiene un usuario (solo `ADMIN`)
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Usuarios]
      operationId: modificarUsuario
      summary: Modifica nombre, rol y estado de un usuario (solo `ADMIN`)
      description: |
        Un `ADMIN` no puede desactivarse ni quitarse el rol `ADMIN` a sí mismo (`409`), y ningún
        cambio puede dejar la aplicación sin al menos un `ADMIN` activo (`409`). Si cambia el rol,
        se desactiva al usuario o se le cambia la contraseña, se cierran sus sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCambioRequest'
      responses:
        '200':
          description: Usuario modificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Un administrador no puede desactivarse ni quitarse el rol a sí mismo, o el cambio dejaría la aplicación sin ningún administrador activo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/usuarios/{id}/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Usuarios]
      operationId: cambiarPasswordUsuario
      summary: Cambia la contraseña de un usuario (solo `ADMIN`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '204':
          description: Contraseña cambiada
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/amistades:
    get:
      tags: [Amistades]
      operationId: listarAmigos
      summary: Lista mis amigos
      responses:
        '200':
          description: Amigos ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amigo'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/amistades/{usuarioId}:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Amistades]
      operationId: eliminarAmistad
      summary: Elimina una amistad
      description: Cualquiera de los dos puede hacerlo. Las invitaciones ya enviadas se mantienen.
      responses:
        '204':
          description: Amistad eliminada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: No sois amigos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/amistades/solicitudes:
    post:
      tags: [Amistades]
      operationId: enviarSolicitudAmistad
      summary: Envía una solicitud de amistad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAmistadRequest'
      responses:
        '201':
          description: Solicitud enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudAmistad'
        '400':
          description: Datos no válidos, o la solicitud es a ti mismo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: El usuario no existe o está desactivado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ya sois amigos o ya hay una solicitud pendiente entre vosotros
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/amistades/solicitudes/recibidas:
    get:
      tags: [Amistades]
      operationId: listarSolicitudesRecibidas
      summary: Lista las solicitudes pendientes que he recibido
      responses:
        '200':
          description: Solicitudes pendientes, las más recientes primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudAmistad'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/amistades/solicitudes/enviadas:
    get:
      tags: [Amistades]
      operationId: listarSolicitudesEnviadas
      summary: Lista las solicitudes pendientes que he enviado
      responses:
        '200':
          description: Solicitudes pendientes, las más recientes primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudAmistad'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/amistades/solicitudes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Amistades]
      operationId: retirarSolicitudAmistad
      summary: Retira una solicitud que he enviado
      responses:
        '204':
          description: Solicitud retirada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: No existe, no es tuya o ya no está pendiente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/amistades/solicitudes/{id}/aceptar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Amistades]
      operationId: aceptarSolicitudAmistad
      summary: Acepta una solicitud recibida
      responses:
        '204':
          description: Solicitud aceptada (ya sois amigos)
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: No existe, no es para ti o ya no está pendiente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/amistades/solicitudes/{id}/rechazar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Amistades]
      operationId: rechazarSolicitudAmistad
      summary: Rechaza una solicitud recibida
      description: La solicitud se elimina; más adelante se puede volver a enviar.
      responses:
        '204':
          description: Solicitud rechazada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: No existe, no es para ti o ya no está pendiente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/config/zona-horaria:
    get:
      tags: [Configuración]
      operationId: obtenerZonaHoraria
      summary: Obtiene la zona horaria de la aplicación
      description: Para cualquier usuario autenticado. Al arrancar es `APP_TIMEZONE`.
      responses:
        '200':
          description: Zona horaria actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonaHoraria'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    put:
      tags: [Configuración]
      operationId: cambiarZonaHoraria
      summary: Cambia la zona horaria (solo `ADMIN`)
      description: Se aplica en caliente y se guarda en la base de datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonaHoraria'
      responses:
        '200':
          description: Zona horaria cambiada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonaHoraria'
        '400':
          description: Identificador IANA no válido o vacío
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no es `ADMIN`, o falta el token CSRF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Cookie de sesión `HttpOnly` que se obtiene con `POST /api/auth/login`

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Sala:
      type: object
      required: [id, nombre, capacidad, planta]
      properties:
        id:
          type: integer
          format: int64
          examples: [1]
        nombre:
          type: string
          examples: [Sala Atlántico]
        capacidad:
          type: integer
          examples: [8]
        planta:
          type: integer
          examples: [2]

    SalaRequest:
      type: object
      required: [nombre, capacidad, planta]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        capacidad:
          type: integer
          minimum: 1
        planta:
          type: integer
          description: Puede ser negativa (sótanos)

    Reserva:
      type: object
      description: |
        Con `detalle: OCUPADA` (el usuario no participa) solo se envían `id`, `salaId`, `fecha`,
        `horaInicio`, `horaFin` y `detalle`.
      required: [id, salaId, fecha, horaInicio, horaFin, detalle]
      properties:
        id:
          type: integer
          format: int64
          examples: [1]
        salaId:
          type: integer
          format: int64
          examples: [1]
        fecha:
          type: string
          format: date
          examples: ['2026-10-15']
        horaInicio:
          $ref: '#/components/schemas/Hora'
        horaFin:
          $ref: '#/components/schemas/Hora'
        usuarioId:
          type: integer
          format: int64
          description: Usuario que hizo la reserva
          examples: [7]
        responsable:
          type: string
          readOnly: true
          description: Nombre del usuario que hizo la reserva
          examples: [Ana García]
        motivo:
          type: string
          examples: [Reunión de planificación]
        detalle:
          type: string
          enum: [COMPLETO, OCUPADA]
          description: Si el usuario ve la reserva completa o solo como franja ocupada
        invitaciones:
          type: array
          description: 'Solo en `GET /api/reservas/{id}` con `detalle: COMPLETO`'
          items:
            $ref: '#/components/schemas/Invitacion'

    PaginaReservas:
      type: object
      required: [content, totalElements, totalPages, number, size]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Página actual, empezando en 0
        size:
          type: integer

    ReservaRequest:
      type: object
      required: [salaId, fecha, horaInicio, horaFin, motivo]
      properties:
        salaId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
          description: Debe ser posterior a hoy (se reserva a partir de mañana)
        horaInicio:
          $ref: '#/components/schemas/Hora'
        horaFin:
          $ref: '#/components/schemas/Hora'
        motivo:
          type: string
          minLength: 1
          maxLength: 255

    Usuario:
      type: object
      required: [id, email, nombre, rol]
      properties:
        id:
          type: integer
          format: int64
          examples: [7]
        email:
          type: string
          format: email
          examples: [ana@example.com]
        nombre:
          type: string
          examples: [Ana García]
        rol:
          $ref: '#/components/schemas/Rol'

    Rol:
      type: string
      enum: [USER, ADMIN]

    UsuarioAdmin:
      type: object
      required: [id, email, nombre, rol, activo, fechaCreacion]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time

    UsuarioResumen:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string

    UsuarioNuevoRequest:
      type: object
      required: [email, nombre, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        password:
          $ref: '#/components/schemas/Password'
        rol:
          allOf:
            - $ref: '#/components/schemas/Rol'
          default: USER

    UsuarioCambioRequest:
      type: object
      required: [nombre, rol, activo]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean

    PasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          $ref: '#/components/schemas/Password'

    Password:
      type: string
      description: De 8 a 72 caracteres (y como mucho 72 bytes en UTF-8)
      minLength: 8
      maxLength: 72
      writeOnly: true

    Amigo:
      type: object
      required: [usuarioId, nombre, desde]
      properties:
        usuarioId:
          type: integer
          format: int64
        nombre:
          type: string
        desde:
          type: string
          format: date-time

    SolicitudAmistad:
      type: object
      required: [id, usuario, fecha]
      properties:
        id:
          type: integer
          format: int64
        usuario:
          description: La otra persona (quien la envía en recibidas; a quien va en enviadas)
          allOf:
            - $ref: '#/components/schemas/UsuarioResumen'
        fecha:
          type: string
          format: date-time

    SolicitudAmistadRequest:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: integer
          format: int64

    Invitacion:
      type: object
      required: [id, reservaId, usuarioId, nombre, estado]
      properties:
        id:
          type: integer
          format: int64
        reservaId:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
          description: Usuario invitado
        nombre:
          type: string
          description: Nombre del usuario invitado
        estado:
          $ref: '#/components/schemas/EstadoInvitacion'

    EstadoInvitacion:
      type: string
      enum: [PENDIENTE, ACEPTADA, RECHAZADA]

    InvitacionRequest:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: integer
          format: int64

    InvitacionRecibida:
      type: object
      required: [id, reserva]
      properties:
        id:
          type: integer
          format: int64
        reserva:
          description: 'La reserva, con `detalle: COMPLETO` (sin `invitaciones`)'
          allOf:
            - $ref: '#/components/schemas/Reserva'

    ZonaHoraria:
      type: object
      required: [zonaHoraria]
      properties:
        zonaHoraria:
          type: string
          description: Identificador IANA
          minLength: 1
          examples: [Europe/Madrid]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    Hora:
      type: string
      description: Hora local en formato `HH:mm`
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      examples: ['09:30']

    ProblemDetail:
      type: object
      description: Error según RFC 9457
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          examples: [Reserva solapada]
        status:
          type: integer
          examples: [409]
        detail:
          type: string
          examples: [La sala 1 ya está reservada el 2026-10-15 de 09:00 a 10:00]
        instance:
          type: string
          format: uri-reference
          examples: [/api/reservas]
        errores:
          type: array
          description: Solo en errores de validación (`400`)
          items:
            $ref: '#/components/schemas/ErrorCampo'

    ErrorCampo:
      type: object
      required: [campo, mensaje]
      properties:
        campo:
          type: string
          examples: [horaFin]
        mensaje:
          type: string
          examples: [debe ser posterior a horaInicio]

  responses:
    ErrorValidacion:
      description: Datos no válidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoAutenticado:
      description: No hay sesión o ha caducado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    SinPermiso:
      description: Sin permiso para la operación, o falta el token CSRF
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Solapamiento:
      description: La reserva se solapa con otra de la misma sala
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
